<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acttus OS</title>
<meta name="description" content="Acttus OS — calendário editorial e operações.">
<meta name="theme-color" content="#14110D">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>window.addEventListener('error',function(e){var b=document.getElementById('errbar');if(b){b.style.display='block';b.textContent='Erro: '+(e.message||e.error);}});</script>
</head>
<body>
<div id="errbar"></div>

<!-- LOGIN -->
<div id="login" class="login">
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="login-brand"><span class="av">A</span><div><div class="nm">Acttus OS</div><div class="sub">Calendário editorial</div></div></div>
    <p class="login-hint">Entre com seu CPF e email cadastrados.</p>
    <label class="fld"><span>CPF</span><input id="loginCpf" inputmode="numeric" placeholder="000.000.000-00" autocomplete="username"></label>
    <label class="fld"><span>Email</span><input id="loginEmail" type="email" placeholder="voce@acttus.com.br" autocomplete="email"></label>
    <div class="login-err" id="loginErr"></div>
    <button class="btn pri lg" id="loginBtn" type="submit">Entrar</button>
  </form>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
 <aside class="rail">
  <div class="brand"><span class="av">A</span><div><div class="nm">Acttus</div><div class="sub">Calendário editorial</div></div></div>
  <div class="railact"><button class="btn pri sm" id="btnCriar"></button><button class="bell" id="btnBell"><span id="bellIc"></span><span class="bdot" id="bellDot" hidden>0</span></button></div>
  <nav class="nav sb-scroll" id="nav"></nav>
  <div class="railfoot"><div class="merow" id="meRow"></div><div class="out" id="logout"><span id="outIc"></span> Sair</div></div>
 </aside>
 <div class="main"><div class="scroll"><div class="wrap" id="view"></div></div></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="mbg" id="modalBg"></div><div class="mbox" id="mboxc"></div></div>
<div class="pop" id="notifpop" hidden></div>

<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
