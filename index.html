<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acttus OS</title>
<meta name="description" content="Acttus OS — calendário editorial e operações.">
<meta name="theme-color" content="#14110D">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E⚙️%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E⚙️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=9">
<script>
function acttusShowErr(msg){
  if(/ResizeObserver loop/i.test(String(msg)))return; // aviso benigno do navegador — ignora
  var b=document.getElementById('errbar');if(!b)return;
  b.innerHTML='<span>Erro: '+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>'
    +'<button type="button" onclick="this.parentNode.style.display=\'none\'" aria-label="Fechar">&#10005;</button>';
  b.style.display='flex';
}
window.addEventListener('error',function(e){acttusShowErr((e&&(e.message||(e.error&&e.error.message)))||'desconhecido');});
window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;acttusShowErr((r&&(r.message||r))||'erro de rede');});
</script>
</head>
<body>
<div id="errbar"></div>

<!-- LOGIN -->
<div id="login" class="login">
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="login-brand"><span class="av">A</span><div><div class="nm">Acttus OS</div><div class="sub">Calendário editorial</div></div></div>
    <p class="login-hint">Entre com seu CPF e email cadastrados.</p>
    <label class="fld"><span>CPF</span><input id="loginCpf" inputmode="numeric" placeholder="000.000.000-00" autocomplete="username"></label>
    <label class="fld"><span>Email</span><input id="loginEmail" type="email" placeholder="voce@acttus.com.br" autocomplete="email"></label>
    <div class="login-err" id="loginErr"></div>
    <button class="btn pri lg" id="loginBtn" type="submit">Entrar</button>
  </form>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
 <div class="scrim" id="scrim"></div>
 <aside class="rail">
  <div class="brand"><span class="av brand-logo"><img src="/logo.png" alt="Acttus" onerror="var s=this.parentNode;s.classList.remove('brand-logo');s.textContent='A'"></span><div><div class="nm">Acttus</div><div class="sub">Calendário editorial</div></div></div>
  <div class="railact"><button class="btn pri sm" id="btnCriar"></button><button class="bell" id="btnBell"><span id="bellIc"></span><span class="bdot" id="bellDot" hidden>0</span></button></div>
  <nav class="nav sb-scroll" id="nav"></nav>
  <div class="railfoot"><div class="theme-row"><span id="themeIc"></span> Modo escuro <button class="switch on" id="themeSwitch" type="button" role="switch" aria-label="Alternar tema claro/escuro"></button></div><div class="merow" id="meRow"></div><div class="out" id="logout"><span id="outIc"></span> Sair</div></div>
 </aside>
 <div class="main">
  <!-- topbar: só aparece no celular, quando a rail vira gaveta -->
  <header class="topbar">
   <button class="tb-btn" id="btnMenu" type="button" aria-label="Abrir menu" aria-controls="app" aria-expanded="false"></button>
   <span class="tb-nm">Acttus OS</span>
   <button class="tb-btn" id="btnCriarM" type="button" aria-label="Novo post"></button>
   <button class="tb-btn" id="btnBellM" type="button" aria-label="Notificações"><span id="bellIcM"></span><span class="bdot" id="bellDotM" hidden>0</span></button>
  </header>
  <div class="scroll"><div class="wrap" id="view"></div></div>
 </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="mbg" id="modalBg"></div><div class="mbox" id="mboxc"></div></div>
<div class="pop" id="notifpop" hidden></div>

<script src="/data.js?v=9"></script>
<script src="/app.js?v=9"></script>
</body>
</html>
